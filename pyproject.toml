[project]
name = "real-time-charts-with-fastapi"
version = "0.2.1"
description = "Sample application for the blog Creating Real-Time Charts with FastAPI"
authors = [
    { name = "Ronie Martinez", email = "ronmarti18@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.108.0",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.51.0",
]

[project.urls]
repository = "https://github.com/roniemartinez/real-time-charts-with-fastapi"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
